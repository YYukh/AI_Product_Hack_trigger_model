server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой путь отдаёт index.html (состояние живёт в query-строке).
    # index.html не кэшируем — иначе после редеплоя браузер грузит старый бандл.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # хешированные ассеты неизменяемы — кэшируем надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
